name: Task 10 MLOps CI

on:
  push:
    paths:
      - "task10_mlops_pipeline/**"
      - ".github/workflows/task10-ci.yml"
  pull_request:
    paths:
      - "task10_mlops_pipeline/**"
      - ".github/workflows/task10-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task10_mlops_pipeline/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r task10_mlops_pipeline/requirements-dev.txt
      - name: Run API tests
        run: python -m pytest task10_mlops_pipeline/tests -q
      - name: Build API container
        run: docker build --tag task10-api:test task10_mlops_pipeline
